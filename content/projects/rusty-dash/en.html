<p>Building a dashboard for in my car running a pi3.<p>
<br>
<p>So far I have a working dashboard app written in rust and slint that allows you to connect your phone and use android auto.</p>
<br>
<p>I am using pi-gen to generate a raspberry pi image with all dependencies, binaries and config files preconfigured.</p>
